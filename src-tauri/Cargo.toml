[package]
name = "rc505-clone"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "BOSS RC-505 MkII virtual clone (Tauri v2 + Rust audio engine)"
authors = ["mk2sim"]
license = "MIT"

[lib]
name = "rc505_clone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
ringbuf = "0.4"
crossbeam-channel = "0.5"
parking_lot = "0.12"
midir = "0.10"
libloading = "0.8"
anyhow = "1"
thiserror = "1"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
